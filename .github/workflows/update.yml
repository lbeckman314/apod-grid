name: Update APOD data

on:
  schedule:
    # Daily at 06:17 UTC, a couple of hours after the new APOD posts (00:05 US Eastern).
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-apod
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch new days
        run: node fetch-apod.mjs --update

      - name: Commit apod.json if it changed
        run: |
          if git diff --quiet apod.json; then
            echo "No new days."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898237+github-actions[bot]@users.noreply.github.com'
          git add apod.json
          git commit -m "Update apod.json to $(node -p 'require("./apod.json")[0].date')"
          git push
